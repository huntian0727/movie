name: Windows Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-and-smoke:
    name: Package, install, and smoke
    runs-on: windows-latest
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - id: npm-cache
        shell: pwsh
        run: '"path=$(npm config get cache)" >> $env:GITHUB_OUTPUT'
      - uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache.outputs.path }}
          key: windows-node-22.23.1-npm-10.9.8-electron-33.4.11-${{ hashFiles('package-lock.json') }}-abi-packaged
      - run: npm install --global npm@10.9.8
      - run: npm ci
      - name: Windows data-safety and release regression gate
        run: npm run test:release-gate
      - name: Production dependency audit
        run: npm audit --omit=dev
      - name: Require signing secrets for tag releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if (-not $env:CSC_LINK -or -not $env:CSC_KEY_PASSWORD) {
            throw 'Tag releases require WINDOWS_CSC_LINK and WINDOWS_CSC_KEY_PASSWORD secrets.'
          }
      - run: npm run package:dir
      - run: npm run verify:artifact
      - run: npm run test:packaged-smoke
      - run: npm run dist:win
      - run: npm run release:metadata
      - run: npm run test:installer-smoke
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ startsWith(github.ref, 'refs/tags/') && 'signed-release' || 'unsigned-test-build' }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*Setup.exe
            release/SHA256SUMS.txt
            release/build-metadata.json
      - name: Publish signed GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem release -File | Where-Object {
            $_.Name -match 'Setup\.exe$' -or $_.Name -in @('SHA256SUMS.txt', 'build-metadata.json')
          } | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME $assets --verify-tag --generate-notes --title "Local Video Manager $env:GITHUB_REF_NAME"
