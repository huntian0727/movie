name: Security audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history-and-dependencies:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
      - run: npm install --global npm@10.9.8
      - run: npm ci
      - name: Audit production and build dependencies
        run: npm audit
      - name: Obtain pinned Gitleaks and verify archive SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force .tmp/gitleaks | Out-Null
          Invoke-WebRequest 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile .tmp/gitleaks/archive.zip
          if ((Get-FileHash .tmp/gitleaks/archive.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e') { throw 'Gitleaks archive integrity failed.' }
          Expand-Archive .tmp/gitleaks/archive.zip .tmp/gitleaks/bin -Force
      - name: Scan complete reachable history with redacted output
        shell: pwsh
        run: |
          & .tmp/gitleaks/bin/gitleaks.exe git --redact=100 --ignore-gitleaks-allow --log-opts='--all --full-history --root' --report-format json --report-path .tmp/history-secrets.json --no-banner
          if ($LASTEXITCODE -ne 0) { throw 'Full-history secrets audit failed; report is redacted.' }
      - name: Export tracked and pending source for privacy and secrets checks
        run: node scripts/audit-public-history.mjs
      - name: Scan current source including new files with redacted output
        shell: pwsh
        run: |
          & .tmp/gitleaks/bin/gitleaks.exe dir .tmp/public-history-audit/tracked-tree --redact=100 --ignore-gitleaks-allow --report-format json --report-path .tmp/source-secrets.json --no-banner
          if ($LASTEXITCODE -ne 0) { throw 'Current-source secrets audit failed; report is redacted.' }
      # Candidate privacy locations require human triage; never publish raw source matches/logs.
