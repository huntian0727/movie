name: Windows CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: Node tests and Windows file safety
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: setup-node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
      - id: npm-cache
        shell: pwsh
        run: '"path=$(npm config get cache)" >> $env:GITHUB_OUTPUT'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.npm-cache.outputs.path }}
          key: windows-node-22.23.1-npm-10.9.8-${{ hashFiles('package-lock.json') }}-abi-node
      - run: npm install --global npm@10.9.8
      - run: npm ci
      - name: Windows data-safety and release regression gate
        # Use runner-owned scratch storage for large real SQLite/WAL fixtures.
        # This preserves the single 60s test and all query budgets.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: npm run test:release-gate

  electron-smoke:
    name: Electron native and main-process smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
      - id: npm-cache
        shell: pwsh
        run: '"path=$(npm config get cache)" >> $env:GITHUB_OUTPUT'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.npm-cache.outputs.path }}
          key: windows-node-22.23.1-npm-10.9.8-electron-44.7.0-${{ hashFiles('package-lock.json') }}-abi-electron
      - run: npm install --global npm@10.9.8
      - run: npm ci
      - run: npm run build
      - run: npm run prepare:electron
      - run: npm run test:electron-smoke
      - run: npm run test:renderer-security-smoke

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
      - run: npm install --global npm@10.9.8
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  unsigned-installation-qa:
    name: Unsigned x64 package and isolated NSIS QA
    needs: [node-tests, electron-smoke, dependency-review]
    if: github.event_name == 'pull_request'
    runs-on: windows-2025
    env:
      MOVIE_RELEASE_CLASS: unsigned-test-build
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm install --global npm@10.9.8
      - run: npm ci
      - run: npm audit
      - run: npm run package:dir
      - run: npm run test:electron-smoke
      - run: npm run test:renderer-security-smoke
      - run: npm run verify:artifact
      - run: npm run test:packaged-smoke
      - run: npm run dist:win
      - run: npm run verify:artifact
      - run: npm run release:metadata
      - run: npm run test:installer-smoke
      - name: Upload verification metadata; binary redistribution remains blocked
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-x64-unsigned-test-build-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/unsigned-test-build/build-metadata.json
            release/unsigned-test-build/build-flavor.json
            release/unsigned-test-build/SHA256SUMS.txt
