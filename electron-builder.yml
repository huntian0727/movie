appId: com.local.video.manager
productName: 拉面影视
directories:
  output: release
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**
npmRebuild: false
extraResources:
  - from: native-bin
    to: native-player
    filter:
      - NativeHost.exe
files:
  - dist-main/**
  - dist-renderer/**
  - package.json
  - '!**/*.map'
  - '!**/.env*'
  - '!**/*.sqlite*'
  - '!tests/**'
  - '!.dbg/**'
  - '!node_modules/ffprobe-static/bin/darwin/**'
  - '!node_modules/ffprobe-static/bin/linux/**'
  - '!node_modules/ffprobe-static/bin/win32/ia32/**'
  - '!node_modules/better-sqlite3/prebuilds/darwin-*.node'
  - '!node_modules/better-sqlite3/prebuilds/linux*.node'
  - '!node_modules/better-sqlite3/prebuilds/win32-arm64.node'
win:
  artifactName: 拉面影视-${version}-${arch}-Setup.${ext}
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  runAfterFinish: false
  allowElevation: false
