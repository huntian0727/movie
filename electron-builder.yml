appId: com.local.video.manager
productName: 拉面影视
directories:
  output: release
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
npmRebuild: false
extraResources:
  - from: native-bin
    to: native-player
    filter:
      - NativeHost.exe
  - from: native-bin/player-runtime
    to: native-player
    filter:
      - libmpv-2.dll
      - Copyright
      - LICENSE.GPL
      - LICENSE.LGPL
files:
  - dist-main/**
  - dist-renderer/**
  - package.json
  - '!**/*.map'
  - '!**/.env*'
  - '!**/*.sqlite*'
  - '!tests/**'
  - '!.dbg/**'
  - '!node_modules/better-sqlite3/prebuilds/darwin-*.node'
  - '!node_modules/better-sqlite3/prebuilds/linux*.node'
  - '!node_modules/better-sqlite3/prebuilds/win32-arm64.node'
win:
  artifactName: 拉面影视-${version}-${arch}-Setup.${ext}
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  runAfterFinish: false
  allowElevation: false
